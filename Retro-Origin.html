// Lange Stat-, Effekt- und Combo-Zeilen bleiben einzeilig, werden aber so weit
// verkleinert, dass auch auf dem schmaleren iPad-Layout nichts abgeschnitten wird.
function fitRewardPanelLines(panel) {
  const lines = panel?.querySelectorAll?.('.rp-fit-line');
  if (!lines || !lines.length) return;

  const app = document.getElementById('app');
  const appWidth = Number(app?.clientWidth) || Number(window.innerWidth) || 0;
  const viewportWidth = Number(window.innerWidth) || appWidth;
  const available = Math.max(0, Math.min(appWidth, viewportWidth) - 20);
  if (!available) return;

  Array.from(lines).forEach(line => {
    if (line.style?.removeProperty) line.style.removeProperty('font-size');
    else if (line.style) line.style.fontSize = '';
    if (line.style) line.style.maxWidth = `${available}px`;

    let fontSize = window.getComputedStyle
      ? parseFloat(window.getComputedStyle(line).fontSize) || 18
      : 18;
    const minSize = line.classList?.contains?.('rp-combo-main') ? 9 : 10;

    for (let pass = 0; pass < 4; pass++) {
      const contentWidth = Number(line.scrollWidth) || 0;
      if (!contentWidth || contentWidth <= available) break;
      fontSize = Math.max(minSize, fontSize * (available / contentWidth) * 0.97);
      if (line.style?.setProperty) line.style.setProperty('font-size', `${fontSize.toFixed(1)}px`, 'important');
      else if (line.style) line.style.fontSize = `${fontSize.toFixed(1)}px`;
    }
  });
}

function renderSpinRewardPanel(entry, wheelID) {
  const panel = document.getElementById('reward-panel');
  panel.textContent = genStep < WHEEL_ORDER.length ? 'TAP FOR NEXT WHEEL' : 'TAP FOR RESULTS';
  panel.style.display = 'block';
}


let lastTickSeg = null;
const MAX_VELOCITY = 0.52;
const LANDING_EDGE_PADDING_RATIO = 0.08;

function getRandomLandingAngle(targetSeg) {
  const start = Number(targetSeg?.startAngle);
  const end = Number(targetSeg?.endAngle);
  const span = end - start;
  if (!Number.isFinite(start) || !Number.isFinite(end) || !(span > 0)) {
    return Number(targetSeg?.centerAngle || 0);
  }
  const edgePadding = span * LANDING_EDGE_PADDING_RATIO;
  return start + edgePadding + Math.random() * (span - edgePadding * 2);
}

function spinToSegment(targetSeg) {
  stopActiveResultSound();
  // Spin RIGHT (clockwise = positive rotation)
  const PI2 = 2 * Math.PI;

  const minRotation = PI2 * 4;

  // The result odds stay unchanged: the segment is chosen first, then the
  // pointer gets a natural random landing position inside that segment.
  // An 8% buffer keeps even tiny wedges unambiguous near their borders.
  const landingAngle = getRandomLandingAngle(targetSeg);
  const targetCanvas = -Math.PI / 2 - landingAngle;
  let extraTurns = Math.ceil((minRotation - ((targetCanvas - currentRotation) % PI2 + PI2) % PI2) / PI2);
  if (extraTurns < 0) extraTurns = 0;
  const finalRotation = currentRotation + ((targetCanvas - currentRotation) % PI2 + PI2) % PI2 + extraTurns * PI2;

  const totalDist = finalRotation - currentRotation; // always positive

  // Ease-out cubic
  // Season 2: das Race-Rad dreht deutlich laenger als die uebrigen -
  // es ist der Auftakt und traegt die Spannung.
  const _isRace = (WHEEL_ORDER[genStep] === 'Race');
  const duration = (_isRace ? 4600 : 3500) + Math.random() * 800; // ms
  const startTime = performance.now();
  const startRotation = currentRotation;

  lastTickSeg = null;
  isSpinningRenderMode = true;
  winnerSeg = null;
  const useCompositor = beginCompositedSpin(startRotation, finalRotation, duration);

  function frame(now) {
    const elapsed = now - startTime;
    const t = Math.min(1, elapsed / duration);
    // ease out cubic
    const ease = 1 - Math.pow(1 - t, 3);
    currentRotation = startRotation + ease * totalDist;

    // Tick sound on segment crossing + live label update
    const curSeg = getSegmentAtPointer(segLayout, currentRotation);
    if (curSeg !== lastTickSeg) {
      lastTickSeg = curSeg;
      const speedFactor = Math.min(1, (1 - ease) / 0.3);
      if (t > 0.01) playSpinTick(speedFactor);
      if (curSeg) { resultText.textContent = getDisplayLabel(curSeg.entry); fitResultText(); }
    }

    // Every wheel uses a pre-rendered compositor layer on iPad-class layouts.
    // If the cache is unavailable (or a resize invalidated it), fall back to
    // the exact vector renderer without changing spin behaviour.
    if (!useCompositor || !updateCompositedSpin(currentRotation)) {
      drawWheel(currentRotation, curSeg);
    }

    if (t < 1) {
      spinRaf = requestAnimationFrame(frame);
    } else {
      currentRotation = finalRotation;
      spinning = false;
      isSpinningRenderMode = false;
      winnerSeg = targetSeg;
      endCompositedSpin();
      drawWheel(currentRotation);
      resultText.textContent = getDisplayLabel(targetSeg.entry);
      setTimeout(() => { fitResultText(); playResultClickBurst(); }, 80);

      if (generatorActive) {
        const idx = segLayout.indexOf(targetSeg);
        const currentWheelID = WHEEL_ORDER[genStep]; // capture before recordResult advances genStep
        recordResult(idx);
        // Show reward panel after stats are applied
        renderSpinRewardPanel(targetSeg.entry, currentWheelID);
        // Wait for user click/tap to advance to next wheel
        pendingAdvance = true;
        setRerollButtonEnabled(Boolean(lastSpinCheckpoint));
      }
    }
  }

  spinRaf = requestAnimationFrame(frame);
}

function initAudio() {
  try {
    const AC=window.AudioContext || window.webkitAudioContext;
    if(!AC) return Promise.resolve(null);
    if(!audioCtx){audioCtx=new AC();masterGain=audioCtx.createGain();masterGain.gain.value=muted?0:MASTER_VOLUME;masterGain.connect(audioCtx.destination);}
    return audioCtx.state==='suspended' ? audioCtx.resume().catch(()=>null) : Promise.resolve(audioCtx);
  } catch(_){ return Promise.resolve(null); }
}
async function prepareSpinAudio(){ await initAudio(); }
function retroNote(freq, duration=.05, delay=0, volume=.15, type='square') {
  if(!audioCtx || muted || audioCtx.state!=='running') return;
  const osc=audioCtx.createOscillator(), gain=audioCtx.createGain(), t=audioCtx.currentTime+delay;
  osc.type=type;osc.frequency.setValueAtTime(freq,t);
  gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(volume,t+.003);
  gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
  osc.connect(gain);gain.connect(masterGain);activeRetroNotes.add(osc);
  osc.onended=()=>{activeRetroNotes.delete(osc);osc.disconnect();gain.disconnect();};
  osc.start(t);osc.stop(t+duration+.01);
}
function stopActiveResultSound(){
  resultSoundTimers.forEach(clearTimeout);resultSoundTimers=[];
  for(const osc of activeRetroNotes){try{osc.stop();}catch(_){}}
  activeRetroNotes.clear();
}
function playSpinTick(speedFactor=1){retroNote(520+Math.round(speedFactor*6)*65,.035,0,.10);}
function playResultClickBurst(){[523.25,659.25,783.99,1046.5].forEach((freq,i)=>retroNote(freq,i===3?.24:.1,i*.095,.15));}
// END RETRO AUDIO


// Tap wheel to spin
canvas.addEventListener('click', async () => {
  if (pendingAdvance) {
    pendingAdvance = false;
    clearLastSpinCheckpoint();
    stopActiveResultSound();
    if (generatorActive) loadNextWheel();
    return;
  }
  if (spinning) return;
  // Reserve the spin immediately, but do not move the wheel until the tiny
  // tick sample is ready. Normally it has already decoded on the name screen.
  spinning = true;
  await prepareSpinAudio();
  if (!generatorActive) startGenerator();
  captureLastSpinCheckpoint();
  resultText.textContent = '???'; resultText.removeAttribute('textLength'); resultText.removeAttribute('lengthAdjust'); resultText.setAttribute('font-size','38'); resultText.setAttribute('letter-spacing','3');
  document.getElementById('reward-panel').style.display = 'none';
  const ep = document.getElementById('effect-preview'); if (ep) ep.style.display = 'none';
  showSpinStartEffectFlash(WHEEL_ORDER[genStep]);
  const target = weightedPickSegment(segLayout);
  spinToSegment(target);
});

// Keyboard shortcut: Space or Enter to spin
document.addEventListener('keydown', async (e) => {
  const raceEditorOverlay = document.getElementById('race-editor-overlay');
  if (raceEditorOverlay?.classList.contains('open')) {
    if (e.code === 'Escape') closeRaceEditor();
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'Escape') e.preventDefault();
    return;
  }
  if (e.code === 'Space' || e.code === 'Enter') {
    // Don't intercept if typing in an input
    if (document.activeElement?.tagName === 'INPUT') return;
    e.preventDefault();
    // If name overlay is visible, submit it
    const nameOverlay = document.getElementById('name-overlay');
    if (nameOverlay && nameOverlay.style.display !== 'none') {
      startWithName();
      return;
    }
    // Otherwise spin
    if (pendingAdvance) {
      pendingAdvance = false;
      clearLastSpinCheckpoint();
      stopActiveResultSound();
      if (generatorActive) loadNextWheel();
      return;
    }
    if (spinning) return;
    spinning = true;
    await prepareSpinAudio();
    if (!generatorActive) startGenerator();
    captureLastSpinCheckpoint();
    resultText.textContent = '???'; resultText.removeAttribute('textLength'); resultText.removeAttribute('lengthAdjust'); resultText.setAttribute('font-size','38'); resultText.setAttribute('letter-spacing','3');
    document.getElementById('reward-panel').style.display = 'none';
    const ep2 = document.getElementById('effect-preview'); if (ep2) ep2.style.display = 'none';
    showSpinStartEffectFlash(WHEEL_ORDER[genStep]);
    const target2 = weightedPickSegment(segLayout);
    spinToSegment(target2);
  }
});

function showSpinStartEffectFlash(wheelID) {
  document.getElementById('reward-panel').style.display = 'none';
}

function closeEndCard() {
  const panel = document.getElementById('end-card-panel');
  panel.style.display = 'none';
  panel.style.flex = '';
  document.getElementById('header-center').style.display = 'flex';
  document.getElementById('wheel-area').style.display = 'flex';
  generatorActive = false;
}

function repeatLastSpin() {
  if (spinning || !pendingAdvance || !generatorActive || !lastSpinCheckpoint) return false;
  stopActiveResultSound();
  if (!restoreLastSpinCheckpoint()) return false;
  currentRotation = 0;
  winnerSeg = null;
  lastTickSeg = null;
  loadNextWheel();
  return true;
}

document.getElementById('reroll-btn').addEventListener('click', repeatLastSpin);

// Race editor controls. Event delegation keeps the editor dormant while it is
// closed and avoids attaching hundreds of listeners to its 44 rows.
document.getElementById('race-editor-btn')?.addEventListener('click', openRaceEditor);
document.getElementById('race-editor-close')?.addEventListener('click', closeRaceEditor);
document.getElementById('race-editor-done')?.addEventListener('click', closeRaceEditor);
document.getElementById('race-editor-overlay')?.addEventListener('click', event => {
  if (event.target.id === 'race-editor-overlay') closeRaceEditor();
});
document.querySelectorAll('.race-editor-wheel-tab').forEach(button => {
  button.addEventListener('click', () => selectWheelEditorWheel(button.dataset.editorWheel));
});
document.querySelectorAll('.race-editor-preset').forEach(button => {
  button.addEventListener('click', () => selectRaceEditorLayoutMode(button.dataset.layoutMode));
});
document.getElementById('race-editor-export')?.addEventListener('click', exportRaceEditorJSON);
document.getElementById('race-editor-import')?.addEventListener('click', () => {
  document.getElementById('race-editor-import-input')?.click();
});
document.getElementById('race-editor-import-input')?.addEventListener('change', async event => {
  const input = event.currentTarget;
  await importRaceEditorJSON(input.files?.[0]);
  input.value = '';
});
document.getElementById('race-editor-reset-all')?.addEventListener('click', resetRaceEditor);

const raceEditorListElement = document.getElementById('race-editor-list');
raceEditorListElement?.addEventListener('click', event => {
  const row = event.target.closest('.race-editor-row');
  if (!row) return;
  const moveButton = event.target.closest('.race-move-btn');
  if (moveButton) {
    moveRaceEditorRow(row, moveButton.dataset.move);
    return;
  }
  if (event.target.closest('.race-color-reset')) {
    setRaceEditorRowColor(row, null, true);
  }
});

raceEditorListElement?.addEventListener('input', event => {
  const row = event.target.closest('.race-editor-row');
  if (!row) return;
  if (event.target.matches('.race-color-picker')) {
    setRaceEditorRowColor(row, event.target.value, false);
    return;
  }
  if (event.target.matches('.race-color-hex')) {
    const color = normalizeRaceEditorHex(event.target.value);
    if (color) setRaceEditorRowColor(row, color, false);
  }
});

raceEditorListElement?.addEventListener('change', event => {
  const row = event.target.closest('.race-editor-row');
  if (!row) return;
  if (event.target.matches('.race-color-picker')) {
    setRaceEditorRowColor(row, event.target.value, false);
    saveRaceEditorState(false);
    return;
  }
  if (event.target.matches('.race-color-preset-select')) {
    const choice = event.target.value;
    if (choice === 'default') setRaceEditorRowColor(row, null, true);
    else {
      const quickColor = STANDARD_RARITY_GRADIENTS[choice]?.[0]
        || RACE_COLORS[choice]?.bg;
      if (quickColor) setRaceEditorRowColor(row, quickColor, false);
    }
    event.target.value = '';
    return;
  }
  if (event.target.matches('.race-color-hex')) {
    const color = normalizeRaceEditorHex(event.target.value);
    if (!color) {
      const id = String(row.dataset.raceId);
      const editorState = getWheelEditorState(activeWheelEditorID);
      const fallback = editorState.colors[id]
        || normalizeRaceEditorHex(row.dataset.defaultColor)
        || '#6E7480';
      event.target.value = fallback;
      setRaceEditorStatus('Use a color like #2D6BE8', true);
    }
  }
});

raceEditorListElement?.addEventListener('pointerdown', event => {
  const handle = event.target.closest('.race-drag-handle');
  if (!handle) return;
  beginRaceEditorDrag(event, handle.closest('.race-editor-row'));
});
document.addEventListener('pointermove', moveRaceEditorDrag, { passive:false });
document.addEventListener('pointerup', endRaceEditorDrag);
document.addEventListener('pointercancel', endRaceEditorDrag);

// iPad Safari may freeze or discard a page shortly after it moves into the
// background. Flush the tiny debounced preference write before that happens.
window.addEventListener('pagehide', () => {
  if (raceEditorSaveTimer) saveRaceEditorState(false);
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && raceEditorSaveTimer) {
    saveRaceEditorState(false);
  }
});

document.getElementById('reset-btn').addEventListener('click', () => {
  if (spinning) return;
  pendingAdvance = false;
  stopActiveResultSound();
  clearLastSpinCheckpoint();
  closeEndCard();
  document.getElementById('name-overlay').style.display = 'flex';
  window.__startAmbient && window.__startAmbient();
  const inp = document.getElementById('champion-input');
  if (inp) { inp.value = ''; setTimeout(() => inp.focus(), 100); }
});

document.querySelector('.ctrl-btn-round').addEventListener('click', () => {
  initAudio();
  muted = !muted;
  if (masterGain) masterGain.gain.value = muted ? 0 : MASTER_VOLUME;
  const btn = document.querySelector('.ctrl-btn-round');
  btn.style.borderColor = muted ? '#e05555' : '';
  btn.title = muted ? 'Sound: aus' : 'Sound: an';
  btn.setAttribute('aria-pressed',String(!muted));
});

function setTab(el) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

window.addEventListener('resize', resize);
resize();
updateWheelIcon('Race');

// Champion name
let championName = '';

function startWithName() {
  const input = document.getElementById('champion-input');
  const name = (input?.value || '').trim();
  championName = name || 'Player';
  // This button/Enter press is the first reliable user gesture on iPad. Use
  // it to unlock Web Audio and decode the tick before the Race wheel is tapped.
  initAudio().catch(() => null);
  document.getElementById('name-overlay').style.display = 'none';
  document.getElementById('champion-name-display').textContent = championName.toUpperCase();
  resize();
  startGenerator();
}

// Allow Enter key in input
document.getElementById('champion-input')?.addEventListener('keydown', e => {
  if (e.key === 'Enter') startWithName();
});

// Focus input on load
if (window.matchMedia('(pointer:fine)').matches) setTimeout(() => document.getElementById('champion-input')?.focus(),100);
if(document.fonts) document.fonts.ready.then(()=>{getResultTextFit._cache?.clear();drawWheel._spinLayerLayout=null;for(const seg of segLayout) delete seg._labelRender;resize();warmResultTextFits(segLayout);fitResultText();});
</script>
