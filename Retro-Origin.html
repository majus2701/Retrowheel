<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
<title>Wheel of Origin — Retro</title>
<style>


  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #000000;
    --bg2: #111111;
    --bg3: #1a1a1a;
    --bg4: #222222;
    --border: #333333;
    --border2: #444444;
    --accent: #c8980a;
    --accent2: #d4a820;
    --text: #ffffff;
    --text2: #aaaaaa;
    --text3: #666666;
    --nav-bg: #161616;
    --btn-bg: #1c1c1c;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    font-family: 'Pixel', system-ui, sans-serif;
    color: var(--text);
    overflow: hidden;
  }

  #app {
    width: 100%;
    max-width: 430px;
    height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    position: relative;
    background: var(--bg);
    overflow: hidden;
  }

  /* HEADER CENTER */
  #header-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 18px 0px;
    flex-shrink: 0;
  }

  #wheel-icon {
    width: 38px;
    height: 38px;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wheel-icon-svg {
    width: 38px;
    height: 38px;
    stroke: #d4a820;
    fill: none;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 8px rgba(200,155,20,0.55));
  }

  #title-card {
    background: rgba(10,7,2,0.85);
    border: 1px solid rgba(160,120,30,0.5);
    border-top-color: rgba(220,180,60,0.7);
    border-radius: 3px;
    padding: 8px 28px;
    font-size: 14px;
    font-weight: 700;
    font-family: Pixel, monospace;
    letter-spacing: 3px;
    text-transform: uppercase;
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    background-image: linear-gradient(180deg, #fffbe8 0%, #f0d878 20%, #c8980a 45%, #e8c84a 60%, #a07008 75%, #d4a820 90%, #f5e080 100%);
    filter: drop-shadow(0 0 8px rgba(200,155,20,0.4));
    margin-bottom: 6px;
  }

  #result-text-svg {
    display: block;
    width: 100%;
    height: 46px;
    overflow: visible;
  }
  #result-text {
    /* SVG text element — styled via attributes */
  }

  /* WHEEL AREA */
  #wheel-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 0;
  }

  #canvas-container {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #reward-panel {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
    z-index: 30;
    text-align: center;
    white-space: nowrap;
    animation: rpPopIn 0.25s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes rpPopIn {
    from { opacity: 0; transform: translateX(-50%) scale(0.85) translateY(4px); }
    to   { opacity: 1; transform: translateX(-50%) scale(1)    translateY(0);   }
  }
  #reward-panel .rp-name {
    display: none;
  }
  #reward-panel .rp-stats {
    font-size: 18px;
    font-weight: 700;
    margin-top: 2px;
    display: block;
    text-shadow: 0 1px 4px rgba(0,0,0,1);
  }
  #reward-panel .rp-combo {
    max-width: calc(100vw - 20px);
    margin-left: auto;
    margin-right: auto;
  }
  #reward-panel .rp-combo-main {
    display: block;
    white-space: nowrap;
  }
  #reward-panel .rp-fit-line {
    display: block;
    max-width: calc(100vw - 20px);
    margin-left: auto;
    margin-right: auto;
    white-space: nowrap;
  }
  /* Die iPad-Regeln geben einzelnen Stat-Chips sonst erneut 28 px. Innerhalb
     einer automatisch angepassten Zeile erben alle Teile dieselbe Schrift. */
  #reward-panel .rp-fit-line .stat-chip,
  #reward-panel .rp-fit-line .stat-chip-sep {
    font-size: inherit !important;
  }
  #reward-panel .rp-trigger {
    display: block;
    max-width: min(86vw, 620px);
    margin: 0 auto;
    color: rgba(225,225,225,0.66);
    font-size: 10px;
    font-weight: 600;
    line-height: 1.18;
    letter-spacing: 0;
    text-transform: none;
    white-space: normal;
    overflow-wrap: anywhere;
    text-shadow: 0 1px 2px rgba(0,0,0,0.9);
  }
  .rp-src {
    color: #f0c040;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .6px;
    margin-right: 7px;
    text-transform: uppercase;
    opacity: .95;
  }
  .rp-pos { color: #55ee77; }
  .rp-neg { color: #ff5544; }
  .rp-neu { color: #666; }

  /* Animated stat chips */
  @keyframes statChipIn {
    0%   { opacity: 0; transform: translateY(18px) scale(0.75); }
    60%  { opacity: 1; transform: translateY(-3px) scale(1.08); }
    100% { opacity: 1; transform: translateY(0px) scale(1); }
  }
  .stat-chip {
    display: inline-block;
    opacity: 0;
    animation: statChipIn 0.38s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    will-change: transform, opacity;
  }
  .stat-chip-sep {
    display: inline-block;
    opacity: 0;
    animation: statChipIn 0.28s ease forwards;
    will-change: opacity;
  }

  #wheel-spin-canvas {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: none;
    pointer-events: none;
    transform-origin: 50% 50%;
    backface-visibility: hidden;
  }

  #wheel-canvas {
    position: relative;
    z-index: 2;
    display: block;
    border-radius: 50%;
  }

  /* BOTTOM CONTROLS */
  #bottom-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px 10px;
    flex-shrink: 0;
    gap: 10px;
  }

  .ctrl-btn-round {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--bg3);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .ctrl-btn-round:active { background: var(--bg4); }
  .ctrl-btn-round svg { width: 18px; height: 18px; fill: none; stroke: var(--text2); stroke-width: 2.2; stroke-linecap: round; }

  #reset-btn {
    flex: 1;
    height: 44px;
    border-radius: 22px;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--accent2);
    font-family: 'Pixel', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.2px;
    transition: background 0.15s;
  }
  #reset-btn:active { background: var(--bg4); }

  .ctrl-btn-edit {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: transparent;
    border: 1px solid rgba(160,120,30,0.34);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s;
    padding: 0;
    opacity: 0.42;
    -webkit-appearance: none;
    appearance: none;
  }
  .ctrl-btn-edit:disabled { opacity: 0.12; cursor: default; }
  .ctrl-btn-edit:not(:disabled):active { background: rgba(200,155,20,0.08); }
  .ctrl-btn-edit svg { width: 18px; height: 18px; fill: none; stroke: rgba(220,185,80,0.82); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  /* RACE COLOR / ORDER EDITOR */
  #race-editor-btn {
    opacity: 0.58;
  }
  #race-editor-btn:disabled {
    opacity: 0.12;
  }
  #race-editor-overlay {
    position: absolute;
    inset: 0;
    z-index: 260;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 12px;
    background: rgba(0,0,0,0.78);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
  }
  #race-editor-overlay.open {
    display: flex;
  }
  #race-editor-panel {
    width: 100%;
    max-height: calc(100% - 8px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-radius: 16px;
    background: #101012;
    border: 1px solid rgba(205,165,55,0.48);
    box-shadow: 0 18px 70px rgba(0,0,0,0.9), 0 0 24px rgba(190,145,25,0.12);
  }
  .race-editor-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 14px 10px;
    border-bottom: 1px solid #28282d;
    flex-shrink: 0;
  }
  .race-editor-title {
    font-family: Pixel, monospace;
    color: #e1b631;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1.5px;
  }
  .race-editor-subtitle {
    margin-top: 3px;
    color: #777780;
    font-size: 10px;
    line-height: 1.25;
  }
  .race-editor-close {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid #34343a;
    background: #1b1b1f;
    color: #aaa;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
  }
  .race-editor-toolbar {
    padding: 10px 12px;
    border-bottom: 1px solid #25252a;
    flex-shrink: 0;
  }
  .race-editor-toolbar-label {
    color: #74747e;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    margin-bottom: 7px;
  }
  .race-editor-toolbar-label.layout-label {
    margin-top: 10px;
  }
  .race-editor-wheel-tabs {
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 6px;
  }
  .race-editor-wheel-tab {
    min-height: 34px;
    padding: 6px 5px;
    border-radius: 9px;
    border: 1px solid #34343b;
    background: #17171c;
    color: #8c8c96;
    font-family: inherit;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 0.5px;
    cursor: pointer;
  }
  .race-editor-wheel-tab.active {
    border-color: rgba(74,167,235,0.74);
    background: rgba(22,105,160,0.18);
    color: #8fd8ff;
  }
  .race-editor-presets {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 6px;
  }
  .race-editor-preset {
    min-height: 34px;
    padding: 6px 5px;
    border-radius: 9px;
    border: 1px solid #34343b;
    background: #1a1a1f;
    color: #8c8c96;
    font-family: inherit;
    font-size: 10px;
    font-weight: 800;
    cursor: pointer;
  }
  .race-editor-preset.active {
    border-color: rgba(218,174,46,0.72);
    background: rgba(183,133,15,0.16);
    color: #efc84f;
  }
  #race-editor-list {
    min-height: 0;
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding: 8px 9px 12px;
  }
  .race-editor-row {
    --race-row-color: #666a74;
    position: relative;
    display: grid;
    grid-template-columns: 28px minmax(0,1fr) auto;
    gap: 8px;
    align-items: center;
    padding: 8px;
    margin-bottom: 7px;
    border-radius: 11px;
    border: 1px solid #2b2b31;
    background: linear-gradient(90deg, color-mix(in srgb, var(--race-row-color) 15%, #151519), #151519 42%);
    touch-action: pan-y;
  }
  .race-editor-row::before {
    content: '';
    position: absolute;
    left: 0;
    top: 8px;
    bottom: 8px;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: var(--race-row-color);
  }
  .race-editor-row.dragging {
    opacity: 0.72;
    border-color: rgba(225,182,49,0.7);
    box-shadow: 0 8px 22px rgba(0,0,0,0.55);
  }
  .race-drag-handle {
    width: 28px;
    height: 46px;
    border: 0;
    background: transparent;
    color: #62626d;
    font-size: 18px;
    cursor: grab;
    touch-action: none;
  }
  .race-editor-main {
    min-width: 0;
  }
  .race-editor-name-line {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
    margin-bottom: 6px;
  }
  .race-editor-name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #f2f2f4;
    font-size: 12px;
    font-weight: 800;
  }
  .race-editor-tier {
    flex-shrink: 0;
    padding: 2px 6px;
    border-radius: 999px;
    color: #fff;
    font-size: 8px;
    font-weight: 900;
    letter-spacing: 0.4px;
    text-shadow: 0 1px 2px #000;
  }
  .race-editor-color-line {
    display: grid;
    grid-template-columns: 37px minmax(72px,96px) minmax(0,1fr) 28px;
    gap: 5px;
    align-items: center;
  }
  .race-color-picker {
    width: 37px;
    height: 29px;
    padding: 1px;
    border: 1px solid #3b3b43;
    border-radius: 7px;
    background: #202027;
  }
  .race-color-preset-select,
  .race-color-hex {
    width: 100%;
    height: 29px;
    border: 1px solid #33333a;
    border-radius: 7px;
    background: #1c1c21;
    color: #bebec7;
    font-family: inherit;
    font-size: 9px;
    outline: none;
  }
  .race-color-preset-select { padding: 0 4px; }
  .race-color-hex {
    padding: 0 7px;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }
  .race-color-reset,
  .race-move-btn {
    border: 1px solid #34343b;
    background: #1d1d22;
    color: #85858e;
    cursor: pointer;
  }
  .race-color-reset {
    width: 28px;
    height: 29px;
    border-radius: 7px;
    font-size: 13px;
  }
  .race-editor-move {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .race-move-btn {
    width: 27px;
    height: 22px;
    border-radius: 6px;
    font-size: 10px;
  }
  .race-editor-footer {
    flex-shrink: 0;
    padding: 9px 10px 10px;
    border-top: 1px solid #29292e;
    background: #121216;
  }
  .race-editor-actions {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 6px;
  }
  .race-editor-action {
    min-height: 34px;
    padding: 6px 4px;
    border-radius: 9px;
    border: 1px solid #34343b;
    background: #1b1b20;
    color: #9999a3;
    font-family: inherit;
    font-size: 9px;
    font-weight: 800;
    cursor: pointer;
  }
  .race-editor-action.primary {
    border-color: rgba(210,166,45,0.62);
    color: #e4bb43;
  }
  #race-editor-status {
    min-height: 15px;
    padding-top: 5px;
    text-align: center;
    color: #6fbc7c;
    font-size: 9px;
  }

  @supports not (background: color-mix(in srgb, red 20%, black)) {
    .race-editor-row { background: #151519; }
  }

  /* BOTTOM NAV */
  #bottom-nav {
    margin: 0 12px 10px;
    background: var(--nav-bg);
    border: 1px solid var(--border);
    border-radius: 26px;
    display: flex;
    align-items: center;
    padding: 6px 4px;
    flex-shrink: 0;
    gap: 2px;
  }

  .nav-tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 8px 4px;
    border-radius: 20px;
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
  }

  .nav-tab.active {
    background: #2a2a2a;
  }

  .nav-tab svg {
    width: 22px; height: 22px;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .nav-tab.active svg { stroke: var(--accent2); }
  .nav-tab:not(.active) svg { stroke: var(--text3); }

  .nav-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  .nav-tab.active .nav-label { color: var(--accent2); }
  .nav-tab:not(.active) .nav-label { color: var(--text3); }

  .nav-tab:not(.active):active { background: #1e1e1e; }


  /* ── iPad (768px+) — TikTok 9:16 scaling ── */
  @media screen and (min-width: 600px) {
    #app {
      max-width: calc(100dvh * 9 / 16);
      width: calc(100dvh * 9 / 16);
    }

    #header-center {
      padding: 2px 22px 0px;
      gap: 1px;
    }

    #wheel-icon {
      width: 58px;
      height: 58px;
      margin-bottom: 2px;
    }

    .wheel-icon-svg {
      width: 58px;
      height: 58px;
    }

    #champion-name-display {
      font-size: 18px !important;
      letter-spacing: 3px !important;
      min-height: 24px !important;
      margin-bottom: 2px !important;
    }

    #title-card {
      font-size: 26px !important;
      padding: 9px 32px !important;
      margin-bottom: 4px !important;
      letter-spacing: 3px !important;
    }

    #result-text-svg {
      height: 80px !important;
    }

    #result-text {
      font-size: 54 !important;
    }

    .rp-stats {
      font-size: 28px !important;
      margin-top: -4px !important;
    }

    .stat-chip {
      font-size: 28px !important;
    }

    .stat-chip-sep {
      font-size: 28px !important;
    }

    #wheel-area {
      padding-top: 14px;
    }

    #effect-preview {
      top: 70px !important;
    }
    #reward-panel {
      top: -28px !important;
    }

    #bottom-controls {
      padding: 10px 22px 10px;
      gap: 12px;
    }

    .ctrl-btn-round {
      width: 52px !important;
      height: 52px !important;
    }

    .ctrl-btn-main, #reset-btn {
      height: 52px !important;
      font-size: 17px !important;
    }

    .ctrl-btn-edit {
      width: 52px !important;
      height: 52px !important;
    }

    #race-editor-overlay { padding: 18px; }
    .race-editor-title { font-size: 17px; }
    .race-editor-subtitle { font-size: 12px; }
    .race-editor-toolbar-label { font-size: 10px; }
    .race-editor-wheel-tab { min-height: 40px; font-size: 12px; }
    .race-editor-preset { min-height: 40px; font-size: 12px; }
    .race-editor-row {
      grid-template-columns: 32px minmax(0,1fr) auto;
      padding: 10px;
      gap: 10px;
    }
    .race-drag-handle { width: 32px; height: 52px; font-size: 21px; }
    .race-editor-name { font-size: 14px; }
    .race-editor-tier { font-size: 9px; }
    .race-editor-color-line {
      grid-template-columns: 42px minmax(88px,112px) minmax(0,1fr) 32px;
      gap: 7px;
    }
    .race-color-picker,
    .race-color-preset-select,
    .race-color-hex { height: 34px; font-size: 11px; }
    .race-color-picker { width: 42px; }
    .race-color-reset { width: 32px; height: 34px; }
    .race-move-btn { width: 31px; height: 25px; }
    .race-editor-action { min-height: 40px; font-size: 11px; }
    #race-editor-status { font-size: 10px; }

    #bottom-nav {
      margin: 0 16px 14px;
    }

    .nav-tab svg {
      width: 28px !important;
      height: 28px !important;
    }

    .nav-label {
      font-size: 14px !important;
    }
  }

  /* ── MOBILE (iPhone / Android) ── */
  @media screen and (max-width: 430px) {
    #app {
      max-width: 100%;
    }

    #wheel-area {
      padding-top: 18px;
    }

    #header-center {
      padding: 6px 14px 0px;
    }

    #wheel-icon {
      width: 28px;
      height: 28px;
      margin-bottom: 2px;
    }

    .wheel-icon-svg {
      width: 28px;
      height: 28px;
    }

    #champion-name-display {
      font-size: 8px !important;
      letter-spacing: 2px !important;
      min-height: 12px !important;
      margin-bottom: 1px !important;
    }

    #title-card {
      font-size: 11px !important;
      padding: 5px 16px !important;
      margin-bottom: 3px !important;
      letter-spacing: 2px !important;
    }

    #result-text-svg {
      height: 38px;
    }

    #result-text {
      font-size: 32 !important;
    }

    .rp-stats {
      font-size: 14px !important;
    }

    .stat-chip {
      font-size: 14px !important;
    }

    #bottom-controls {
      padding: 8px 14px 8px;
      gap: 8px;
    }

    .ctrl-btn-round {
      width: 36px !important;
      height: 36px !important;
    }

    .ctrl-btn-main {
      height: 36px !important;
      font-size: 12px !important;
      letter-spacing: 1px !important;
    }

    .ctrl-btn-edit {

function _raceHexMix(a, b, f) {
  const ar=parseInt(a.slice(1,3),16), ag=parseInt(a.slice(3,5),16), ab=parseInt(a.slice(5,7),16);
  const br=parseInt(b.slice(1,3),16), bg=parseInt(b.slice(3,5),16), bb=parseInt(b.slice(5,7),16);
  const r=Math.round(ar+(br-ar)*f), g=Math.round(ag+(bg-ag)*f), bl=Math.round(ab+(bb-ab)*f);
  return '#' + [r,g,bl].map(x=>x.toString(16).padStart(2,'0')).join('');
}

function standardRarityGradientColor(tier, idxInTier, tierCount) {
  const stops = STANDARD_RARITY_GRADIENTS[tier];
  if (!stops || stops.length === 0) return null;
  if (stops.length === 1 || tierCount <= 1) return { bg:stops[0], text:'#ffffff' };

  const f = Math.max(0, Math.min(1, idxInTier / (tierCount - 1)));
  const scaled = f * (stops.length - 1);
  const nearest = Math.round(scaled);
  if (Math.abs(scaled - nearest) < 1e-10) {
    return { bg:stops[nearest], text:'#ffffff' };
  }
  const left = Math.floor(scaled);
  const right = Math.min(stops.length - 1, left + 1);
  return {
    bg:_raceHexMix(stops[left], stops[right], scaled - left),
    text:'#ffffff'
  };
}

// Returns a shade for a race segment given its index within its tier group
function raceGradientColor(tier, idxInTier, tierCount) {
  const standard = standardRarityGradientColor(tier, idxInTier, tierCount);
  if (standard) return standard;
  const anchors = RACE_GRAD[tier] || RACE_GRAD.Common;
  const f = tierCount <= 1 ? 0 : idxInTier / (tierCount - 1);
  const base = RACE_COLORS[tier] || RACE_COLORS.Common;
  return { bg: _raceHexMix(anchors[0], anchors[1], f), text: base.text };
}

// Shift hex color lightness by amount (positive = lighter, negative = darker)
function hexShiftL(hex, amount) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  const clamp = v => Math.max(0, Math.min(255, Math.round(v + amount)));
  return '#' + [clamp(r), clamp(g), clamp(b)].map(v => v.toString(16).padStart(2,'0')).join('');
}

// ── WEIGHTED RANDOM ───────────────────────────────────────────────
function weightedRandom(entries) {
  const total = entries.reduce((s, e) => s + e.baseWeight, 0);
  let r = Math.random() * total;
  for (const e of entries) {
    r -= e.baseWeight;
    if (r <= 0) return e;
  }
  return entries[entries.length - 1];
}

//  SEASON 2 — BAUSTEINSYSTEM
//  Ersetzt die 37 Einzeleffekte aus Season 1. Jeder Beruf besteht aus
//  ein bis drei Bausteinen, die hier zentral ausgewertet werden.

const S2_CLASS_ORDER = ['Common','Uncommon','Rare','Epic','Legendary','Mythic'];
const S2_SHIFT_CAP   = 'Legendary';   // kein Effekt schaltet das Mythic-Rad frei
const S2_STAT_WHEELS = { STR:'STR', IQ:'IQ', Speed:'SPD', Dura:'DUR' };

// Alle Bausteine, die gerade aktiv sind (Beruf + Rasse)
function s2Blocks() {
  const out = [];
  const prof = genResults['Profession']?.displayName;
  const race = genResults['Race']?.displayName;
  if (prof && S2_PROF_EFFECTS[prof]) out.push(...S2_PROF_EFFECTS[prof]);
  if (race && S2_RACE_EFFECTS[race]) out.push(...S2_RACE_EFFECTS[race]);
  return out;
}

// Separate flache Profession-Statboni sind in Season 2 bewusst deaktiviert.
// Das Objekt bleibt fuer die zentrale Stat-Abrechnung bestehen und ist damit
// im normalen Generatorfluss immer null auf allen sechs Stats.
let s2FlatBonus = { STR:0, IQ:0, SPD:0, DUR:0, PM:0, DEF:0 };

// PM und DEF haben kein eigenes Rad. Profession-Bausteine werden deshalb nicht
// in schwer nachvollziehbare Zusatzpunkte umgerechnet.
const S2_NO_WHEEL = ['PM', 'DEF'];
function s2ApplyFlatStatBlocks() {
  const d = {};
  const race = genResults['Race']?.displayName;
  const raceBlocks = race && S2_RACE_EFFECTS[race] ? S2_RACE_EFFECTS[race] : [];
  for (const b of raceBlocks) {
    if (b[0] !== 'up' && b[0] !== 'down') continue;
    if (!S2_NO_WHEEL.includes(b[1])) continue;
    const v = (b[0] === 'up' ? 2 : -2) * b[2];
    d[b[1]] = (d[b[1]] || 0) + v;
  }
  const keys = Object.keys(d);
  if (!keys.length) return;
  keys.forEach(k => { genStats[k] += d[k]; s2FlatBonus[k] += d[k]; });
  const parts = keys.map(k =>
    `<span class="${d[k] > 0 ? 'rp-pos' : 'rp-neg'}">${d[k] > 0 ? '+' : ''}${d[k]} ${k}</span>`);
  lastComboPanel = `<span class="rp-stats rp-fit-line"><span class="rp-src">BONUS</span>`
                 + `${parts.join('<span class="rp-neu"> · </span>')}</span>`;
}

function s2StatWheelClass(wheelID) {
  const base = genResults['Race']?.tier || 'Common';
  const stat = S2_STAT_WHEELS[wheelID];
  if (!stat) return base;
  let steps = 0;
  for (const b of s2Blocks()) {
    if (b[0] === 'up'   && b[1] === stat) steps += b[2];
    if (b[0] === 'down' && b[1] === stat) steps -= b[2];
  }
  steps += (s2Combo.wheelUp[stat] || 0);   // Combos koennen ebenfalls schieben
  if (steps === 0) return base;
  let i = S2_CLASS_ORDER.indexOf(base);
  if (i < 0) i = 0;
  const cap = S2_CLASS_ORDER.indexOf(S2_SHIFT_CAP);
  let j = i + steps;
  if (steps > 0) j = Math.min(j, Math.max(i, cap));   // nie ueber Legendary, nie unter den Ist-Stand
  j = Math.max(0, Math.min(j, S2_CLASS_ORDER.length - 1));
  return S2_CLASS_ORDER[j];
}

// Wuerfel-Baustein (The Lost): jeder Stat kriegt eine zufaellige Klasse
let s2DiceClass = null;
function s2DiceFor(stat) {
  if (!s2DiceClass) {
    s2DiceClass = {};
    for (const s of ['STR','IQ','SPD','DUR']) {
      s2DiceClass[s] = S2_CLASS_ORDER[Math.floor(Math.random() * 5)];  // Common..Legendary
    }
  }
  return s2DiceClass[stat];
}
function s2HasDice() { return s2Blocks().some(b => b[0] === 'dice'); }

// Welche Loot-Raeder meint ein Baustein?
function s2WheelMatches(target, wheelID) {
  if (target === wheelID) return true;
  if (target === 'Loot')     return ['Companion','Weapon','Enchantment','Armor','Power'].includes(wheelID);
  if (target === 'DarkAll')  return ['Weapon','Armor','Curse'].includes(wheelID);
  return false;
}

const S2_RARE_UP = ['Rare','Epic','Legendary','Mythic'];

// Gewichtsmultiplikator aus allen Bausteinen
function s2WeightMul(entry, wheelID) {
  let m = 1;
  const name = (entry.displayName || '').toLowerCase();
  const tier = entry.tier || 'Common';
  const isStat = !!S2_STAT_WHEELS[wheelID];
  const val = isStat ? (entry[S2_STAT_WHEELS[wheelID]] ?? 0) : null;

  for (const b of s2Blocks()) {
    switch (b[0]) {
      case 'focus': {
        if (!s2WheelMatches(b[1], wheelID)) break;
        const kws = b[2];
        const hit = (kws.length === 1 && kws[0] === '') ? true
                  : kws.some(k => k && name.includes(k));
        if (hit) m *= b[3];
        break;
      }
      case 'tier': {
        if (!s2WheelMatches(b[1], wheelID)) break;
        const n = b[2];
        if (n > 0 && S2_RARE_UP.includes(tier)) m *= (n >= 2 ? 2.8 : 1.8);
        if (n < 0 && (tier === 'Common' || isEmptyEntry(entry))) m *= 1.6;
        if (n < 0 && S2_RARE_UP.includes(tier)) m *= 0.7;
        break;
      }
      case 'chaos': {
        if (!isStat) break;
        const list = b[1];
        if (list !== 'all' && !list.includes(S2_STAT_WHEELS[wheelID])) break;
        const CH = {0:4.0,1:2.5,2:1.5,3:0.5,4:0.4,5:0.4,6:0.4,7:0.5,8:1.5,9:2.5,10:4.0};
        m *= (CH[val] ?? 1);
        break;
      }
      case 'high': {
        if (!isStat) break;
        const list = b[1];
        if (list !== 'all' && !list.includes(S2_STAT_WHEELS[wheelID])) break;
        if (val === 10) m *= 4; else if (val === 9) m *= 2.5;
        break;
      }
    }
  }
  return m;
}

// Garantien: Leer- UND Common-Eintraege fliegen vom Rad
function s2FilterEntries(entries, wheelID) {
  let out = entries;
  for (const b of s2Blocks()) {
    if (b[0] === 'guard' && b[1] === wheelID) {
      out = out.filter(e => !isEmptyEntry(e) && e.tier !== 'Common');
    }
    if (b[0] === 'slotonly' && wheelID === 'Weapon') {
      out = out.filter(e => !isEmptyEntry(e) && (e.slots || 0) >= 1);
    }
  }
  return out.length ? out : entries;   // nie leer laufen lassen
}

  return s2Blocks().some(b => b[0] === 'curse2blessing');

function getEffectiveWeight(entry, wheelID) {

  s2Combo = { wheelUp: {}, guard: [], extraSlot: 0 };

// ── Combo-Assist ─────────────────────────────────────────────────
// Ohne diese Hochgewichtung laege Dragon Legacy bei 1 zu 4.600.
function applyComboAssistWeight(entry, wheelID, w) {
  if (wheelID === 'Race') return w;
  const race = genResults['Race']?.displayName || '';
  const n = (entry.displayName || '').toLowerCase();
  const open = (name) => !triggeredCombos.some(c => c.name === name);

  if (wheelID === 'Weapon') {
    if (race === 'Dragonborn' && n.includes('dragon') && open('Dragon Legacy')) w *= 12;
    if (race === 'Angel' && s2Has(n,'excalibur','sun','holy','skyfall') && open('Holy Arsenal')) w *= 12;
    if (race === 'Demon' && s2Has(n,'black','demonic','infernal','reaper') && open('Infernal Weapon')) w *= 12;
  }
  if (wheelID === 'Companion' && race === 'Dragonborn' &&
      s2Has(n,'dragon','wyvern') && open('Dragon Rider')) w *= 12;
  if (wheelID === 'Armor' && race === 'Crystalborn' &&
      n.includes('crystal') && open('Crystal Fortress')) w *= 15;
  return w;
}

// ── Combo anwenden ───────────────────────────────────────────────
function s2ComboSource(...items) {
  return items
    .flat()
    .map(item => typeof item === 'string' ? item : item?.displayName)
    .filter(Boolean)
    .join(' + ');
}

function s2EscHtml(value) {
  return String(value || '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  })[ch]);
}

function applyCombo(name, delta, extra, source) {
  if (triggeredCombos.find(c => c.name === name)) return;
  triggeredCombos.push({ name, delta: delta || {}, source: source || '' });
  STAT_KEYS.forEach(k => { genStats[k] += Number((delta || {})[k] || 0); });

  let note = '';
  if (extra) {
    if (extra.wheelUp) { for (const s in extra.wheelUp) s2Combo.wheelUp[s] = (s2Combo.wheelUp[s]||0) + extra.wheelUp[s]; note = 'WHEEL UPGRADE'; }
    if (extra.guard)   { s2Combo.guard.push(...extra.guard); note = 'GUARANTEED'; }
    if (extra.slot)    { s2Combo.extraSlot += extra.slot;    note = 'EXTRA SLOT'; }
    if (extra.double)  { note = (extra.factor >= 1) ? 'DOUBLED' : 'EMPOWERED'; }
  }

  const parts = STAT_KEYS.filter(k => (delta||{})[k]).map(k => {
    const v = delta[k];
    return `<span class="${v > 0 ? 'rp-pos' : 'rp-neg'}">${v > 0 ? '+' : ''}${v} ${k}</span>`;
  });
  if (note) parts.unshift(`<span class="rp-pos" style="letter-spacing:.5px;">${note}</span>`);
  // Die Herkunft steht klein direkt vor den Werten in derselben Zeile,
  // damit man sieht, dass es ein Bonus ist und woher er kommt.
  const _kind = name.endsWith(" Set") ? "SET" : "COMBO";
  const sourceLine = source
    ? `<span class="rp-trigger">↳ ${s2EscHtml(source)}</span>`
    : '';
  // Append instead of overwrite so two combos caused by the same result are
  // both explained in the reward panel.
  lastComboPanel += `<span class="rp-stats rp-combo"><span class="rp-combo-main rp-fit-line"><span class="rp-src">${_kind}: ${s2EscHtml(name)}</span>`
                  + `${parts.join('<span class="rp-neu"> · </span>')}</span>${sourceLine}</span>`;
}

// Verdoppelt die Werte des ausloesenden Eintrags
// Werte des ausloesenden Eintrags noch einmal obendrauf, ganz oder anteilig.
// True Form nutzt nur die Haelfte: eine verdoppelte Rassen-Power (Σ15-17)
// war der groesste Einzelposten im Vorsprung der Legendary-Rassen.
function s2Double(name, entry, factor, source) {
  if (!entry) return;
  const f = (factor === undefined) ? 1 : factor;
  const d = {};
  STAT_KEYS.forEach(k => {
    if (!entry[k]) return;
    const v = entry[k] > 0 ? Math.floor(entry[k] * f) : Math.ceil(entry[k] * f);
    if (v) d[k] = v;
  });
  applyCombo(name, d, { double: true, factor: f }, source);
}

  for (const k in S2_SETS) if (S2_SETS[k].kw.some(x => n.includes(x))) return k;

// ── Die 26 Combos ────────────────────────────────────────────────
function checkAndApplyCombos(triggerType, lastEntry) {
  const r = genResults;
  const race = r.Race?.displayName || '';
  const prof = r.Profession?.displayName || '';
  const rTier = r.Race?.tier || '';

  // Mythic-Treffer - nur auf den LOOT-Raedern. Auf den Stat-Raedern traegt
  // das 10er-Segment ebenfalls die Stufe 'Mythic' (das ist dort nur die
  // Farbe). Ohne diese Einschraenkung wuerde eine 10 auf dem STR-Rad den
  // Combo ausloesen und Punkte auf alle sechs Stats geben.
  const S2_LOOT_WHEELS = ['Companion','Weapon','Enchantment','Armor','Power','Blessing','Curse'];
  if (triggerType === 'OnMythicHit' && lastEntry?.tier === S2_MYTHIC
      && S2_LOOT_WHEELS.includes(lastEntry?.wheelID)) {
    if (rTier === 'Common') applyCombo(
      'Against All Odds',
      {STR:2,IQ:2,SPD:2,DUR:2,PM:2,DEF:2},
      null,
      s2ComboSource(r.Race, lastEntry)
    );
    const mythEntries = ['Companion','Weapon','Armor','Power','Blessing','Curse']
      .map(k => r[k])
      .filter(entry => entry && entry.tier === S2_MYTHIC);
    if (mythEntries.length >= 2) applyCombo(
      'Chosen By The Wheel',
      {STR:3,IQ:3,SPD:3,DUR:3,PM:3,DEF:3},
      null,
      s2ComboSource(mythEntries)
    );
  }

  if (triggerType === 'AfterProfession') {
    if (['Orc','Minotaur','Oni','Titan'].includes(race) &&
        ['Berserker','Gladiator','Champion','Beast Butcher'].includes(prof))
      applyCombo('Born Fighter', {}, { wheelUp:{STR:1} }, s2ComboSource(race, prof));
    if (['Elf','Djinn','Voidborn','Elemental'].includes(race) &&
        ['Mage','Witch','Storm Caller','Oracle'].includes(prof))
      applyCombo('Arcane Bloodline', {PM:3}, null, s2ComboSource(race, prof));
    if (['Mechanoid','Clockwork Doll'].includes(race) &&
        ['Blacksmith','Toymaker','Shield Sentinel'].includes(prof))
      applyCombo('Machine Soul', {}, { wheelUp:{DUR:1} }, s2ComboSource(race, prof));
    if (['Ratfolk','Goblin','Gnome','Fishman'].includes(race) &&
        ['Thief','Relic Thief','Gambler'].includes(prof))
      applyCombo('Street Rat', {}, { wheelUp:{SPD:1} }, s2ComboSource(race, prof));
    if (race === 'Angel' &&
        ['Oathbreaker','Murderer','Grave Robber','Cursed One','Void Intern','Prisoner','Drunkard'].includes(prof))
      applyCombo('Fallen Grace', {STR:3,PM:3,DEF:-2}, null, s2ComboSource(race, prof));
  }

  if (triggerType === 'AfterCompanion') {
    if (race === 'Dragonborn' && s2Has(lastEntry?.displayName,'dragon','wyvern'))
      s2Double('Dragon Rider', lastEntry, 1, s2ComboSource(race, lastEntry));
  }

  if (triggerType === 'AfterWeapon') {
    const n = lastEntry?.displayName || '';
    if (race === 'Dragonborn' && n.toLowerCase().includes('dragon'))
      s2Double('Dragon Legacy', lastEntry, 1, s2ComboSource(race, lastEntry));
    if (prof === 'Blacksmith' && (lastEntry?.slots || 0) >= 2)
      applyCombo('Masterwork', {STR:2,DEF:1}, { slot:1 }, s2ComboSource(prof, lastEntry));
    if (race === 'Angel' && s2Has(n,'excalibur','sun','holy','skyfall'))
      applyCombo('Holy Arsenal', {IQ:2,DUR:2,PM:3,DEF:2}, null, s2ComboSource(race, lastEntry));
    if (race === 'Demon' && s2Has(n,'black','demonic','infernal','reaper'))
      applyCombo('Infernal Weapon', {STR:4,PM:3}, null, s2ComboSource(race, lastEntry));
    if (['Berserker','Gladiator','Murderer','Beast Butcher','Lumberjack','Champion'].includes(prof) &&
        s2Has(n,'axe','sword','hammer','katana','scythe','blade','great','knife','dagger'))
      applyCombo("Berserker's Edge", {STR:4,DEF:-1}, null, s2ComboSource(prof, lastEntry));
    if (['Ranger','Bounty Hunter','Cartographer','Thief','Relic Thief'].includes(prof) &&
        s2Has(n,'bow','shuriken','harpoon','sling','frisbee','piercer'))
      applyCombo('Perfect Shot', {SPD:4,IQ:1}, null, s2ComboSource(prof, lastEntry));
    if (['Chef','Storm Chef'].includes(prof) && s2Has(n,'pan','knife','fork'))
      applyCombo('Kitchen Nightmare', {STR:3,IQ:2,PM:2}, null, s2ComboSource(prof, lastEntry));
  }

  if (triggerType === 'AfterEnchantment') {
    if (['Rune Hunter','Alchemist','Toymaker'].includes(prof) && lastEntry?.tier === 'Common')
      applyCombo('Runebound', {IQ:2,PM:3}, null, s2ComboSource(prof, lastEntry));
  }

  if (triggerType === 'AfterArmor') {
    const n = lastEntry?.displayName || '';
    if (['Knight','Shield Sentinel','Dungeon Warden','Champion','Royal Heir'].includes(prof) &&
        S2_RAREUP.includes(lastEntry?.tier))
      applyCombo('Full Plate', {DUR:3,DEF:3}, null, s2ComboSource(prof, lastEntry));
    if (race === 'Crystalborn' && n === 'Crystal Plate')
      applyCombo('Crystal Fortress', {DUR:3,PM:2,DEF:4}, null, s2ComboSource(race, lastEntry));
    if (race === 'Mechanoid' &&
        r.Weapon?.parentResult === 'Mechanoid' && r.Armor?.parentResult === 'Mechanoid')
      applyCombo('Machine Complete', {STR:2,DUR:3,PM:2,DEF:3}, null, s2ComboSource(race, r.Weapon, r.Armor));
    s2CheckSet();
  }

  if (triggerType === 'AfterPower') {
    if (lastEntry?.parentResult === race && lastEntry?.parentWheel === 'Race')
      s2Double('True Form', lastEntry, 0.5, s2ComboSource(race, lastEntry));
    if (['Mage','Oracle','Storm Caller','Exorcist'].includes(prof) &&
        ['Epic','Legendary','Mythic'].includes(lastEntry?.tier))
      applyCombo('Mind Over Matter', {IQ:3,PM:4}, null, s2ComboSource(prof, lastEntry));
  }

  if (triggerType === 'AfterFate') {
    const ft = lastEntry?.tier;
    if (race === 'Noxaphim' && lastEntry?.wheelID === 'Blessing')
      applyCombo('Celestial Nature', {IQ:2,DEF:2}, null, s2ComboSource(race, lastEntry));
    if (race === 'Noxaphim' && lastEntry?.wheelID === 'Curse')
      applyCombo('Infernal Nature', {STR:2,PM:2}, null, s2ComboSource(race, lastEntry));
    if (race === 'Demon' && lastEntry?.wheelID === 'Curse' &&
        ['Epic','Legendary','Mythic'].includes(ft))
      applyCombo("Devil's Deal", {STR:3,PM:4}, null, s2ComboSource(race, lastEntry));
    if (prof === 'Blessed' && lastEntry?.wheelID === 'Blessing' &&
        ['Legendary','Mythic'].includes(ft))
      applyCombo('Divine Favor', {IQ:2,PM:3,DEF:3}, null, s2ComboSource(prof, lastEntry));
  }
}


function getEntriesForWheel(wheelID, parentResult) {
  return WHEEL_ENTRIES.filter(e => e.wheelID === wheelID && getEffectiveWeight(e,wheelID) > 0);

function buildSegmentsFromEntries(entries) {
  return entries.map(e => {
    const tc = TIER_COLORS[e.tier] || TIER_COLORS.Common;
    return { label: e.displayName, color: tc.bg, textColor: tc.text, entry: e };
  });
}

function startGenerator() {
  clearLastSpinCheckpoint();
  s2DiceClass = null;
  s2ResetCombos();
  s2FlatBonus = { STR:0, IQ:0, SPD:0, DUR:0, PM:0, DEF:0 };
  genStep    = 0;
  genResults = {};
  genStats   = { STR: 0, IQ: 0, SPD: 0, DUR: 0, PM: 0, DEF: 0 };
  enchantmentsRolled = [];
  enchantmentSlotsLeft = 0;
  triggeredCombos = [];
  generatorActive = true;
  currentChampionSaved = false;
  loadNextWheel();
}

function loadNextWheel() {
  const rewardPanel = document.getElementById('reward-panel');
  if (rewardPanel) rewardPanel.style.display = 'none';
  const flashBox = document.getElementById('spin-effect-flash');
  if (flashBox) flashBox.style.display = 'none';
  const effectCard = document.getElementById('effect-card-flash');
  if (effectCard) effectCard.style.display = 'none';
  clearTimeout(window.effectFlashTimeout);
  clearTimeout(window.professionEffectTimeout);

  if (genStep >= WHEEL_ORDER.length) {
    showEndCard();
    return;
  }
  const wheelID = WHEEL_ORDER[genStep];
  const parentResult = genResults['Race'] ? genResults['Race'].displayName : null;

  // ── Enchantment special logic ──────────────────────────────────
  if (wheelID === 'Enchantment') {
    const weapon = genResults['Weapon'];
    const slots = weapon ? (weapon.slots || 0) : 0;

    // First time hitting Enchantment: set how many spins needed
    if (enchantmentSlotsLeft === 0) {
      if (!weapon || weapon.displayName === 'No Weapon' || slots === 0) {
        // Skip enchantment entirely
        genStep++;
        loadNextWheel();
        return;
      }
      enchantmentSlotsLeft = slots + (s2Combo.extraSlot || 0);
    }
    // If we still have spins left, show enchantment wheel (don't advance genStep)
  }

  const entries = getEntriesForWheel(wheelID, parentResult);

  // If no entries (e.g. Race has no real Subraces), skip silently
  if (entries.length === 0) {
    if (wheelID === 'Subrace') genResults['Subrace'] = null;
    genStep++;
    loadNextWheel();
    return;
  }

  // Update title card + icon
  document.getElementById('title-card').textContent = RETRO_WHEELS[wheelID]?.label || wheelID;
  const _rt = document.getElementById('result-text'); _rt.textContent = '???'; _rt.removeAttribute('textLength'); _rt.removeAttribute('lengthAdjust'); _rt.setAttribute('font-size','38'); _rt.setAttribute('letter-spacing','3');
  updateWheelIcon(wheelID);
  renderEffectPreview(wheelID);

  // Build weighted segment layout
  segLayout = buildSegments(entries, wheelID);
  currentRotation = 0;
  winnerSeg = null;
  drawWheel(currentRotation);
  // Prepare the live headline sizes before the user starts spinning. Dense
  // wheels then perform no canvas text measurements inside the animation.
  warmResultTextFits(segLayout);
}

function getResultTextFit(text, maxW) {
  const cache = getResultTextFit._cache || (getResultTextFit._cache = new Map());
  const cacheKey = `${maxW}|${text}`;
  if (cache.has(cacheKey)) return cache.get(cacheKey);

  // Use canvas to measure — works on all devices regardless of font loading
  const canvas = getResultTextFit._canvas || (getResultTextFit._canvas = document.createElement('canvas'));
  const measureCtx = canvas.getContext('2d');

  let fs = 38;
  let ls = 3;

  function measureWidth() {
    measureCtx.font = `900 ${fs}px 'Pixel', sans-serif`;
    let w = 0;
    for (const ch of text) w += measureCtx.measureText(ch).width;
    w += ls * Math.max(0, text.length - 1);
    return w;
  }

  // Shrink font until it fits
  while (measureWidth() > maxW && fs > 11) {
    fs -= 1;
    ls = Math.max(0, ls - 0.15);
  }

  const fit = { fontSize: fs, letterSpacing: ls.toFixed(2) };
  cache.set(cacheKey, fit);
  return fit;
}

function getResultTextMaxWidth() {
  return 342; // Logical SVG units; the whole headline scales with its 390-wide viewBox.
}

function warmResultTextFits(layout) {
  const maxW = getResultTextMaxWidth();
  const seen = new Set();
  for (const seg of layout || []) {
    const text = getDisplayLabel(seg.entry);
    if (!text || seen.has(text)) continue;
    seen.add(text);
    getResultTextFit(text, maxW);
  }
}

function setSvgAttributeIfChanged(element, name, value) {
  const next = String(value);
  if (!element.getAttribute || element.getAttribute(name) !== next) {
    element.setAttribute(name, next);
  }
}

function removeSvgAttributeIfPresent(element, name) {
  if (!element.hasAttribute || element.hasAttribute(name)) {
    element.removeAttribute(name);
  }
}

function fitResultText() {
  const el = resultText;
  const svg = document.getElementById('result-text-svg');
  if (!el || !svg) return;

  const text = el.textContent;

  // Avoid repeatedly invalidating the filtered SVG headline on every Race
  // segment crossing when its fitted attributes have not actually changed.
  removeSvgAttributeIfPresent(el, 'textLength');
  removeSvgAttributeIfPresent(el, 'lengthAdjust');

  if (!text || text === '???') {
    setSvgAttributeIfChanged(el, 'font-size', '38');
    setSvgAttributeIfChanged(el, 'letter-spacing', '3');
    return;
  }

  const fit = getResultTextFit(text, getResultTextMaxWidth());

  setSvgAttributeIfChanged(el, 'font-size', fit.fontSize);
  setSvgAttributeIfChanged(el, 'letter-spacing', fit.letterSpacing);
}

function normalizeRaceEditorHex(value) {
  const match = String(value || '').trim().match(/^#?([0-9a-f]{6})$/i);
  return match ? `#${match[1].toUpperCase()}` : null;
}

function getDefaultRaceEditorState() {
  return {
    version:1,
    layoutMode:'tier',
    order:[...DEFAULT_RACE_EDITOR_ORDER],
    colors:{...DEFAULT_RACE_EDITOR_COLORS}
  };
}

function getDefaultProfessionEditorState() {

function getDefaultWheelEditorState(wheelID) {
  return wheelID === 'Profession'
    ? getDefaultProfessionEditorState()
    : getDefaultRaceEditorState();
}

function sanitizeWheelEditorState(wheelID, input) {
  const safeWheelID = WHEEL_EDITOR_IDS.has(wheelID) ? wheelID : 'Race';
  const fallback = getDefaultWheelEditorState(safeWheelID);
  if (!input || typeof input !== 'object') return fallback;

  const validIds = new Set(
    WHEEL_ENTRIES.filter(entry => entry.wheelID === safeWheelID).map(entry => String(entry.id))
  );
  const colors = {};
  if (input.colors && typeof input.colors === 'object') {
    for (const [rawId, rawColor] of Object.entries(input.colors)) {
      const id = String(rawId);
      const color = normalizeRaceEditorHex(rawColor);
      if (validIds.has(id) && color) colors[id] = color;
    }
  }

  const order = [];
  const seen = new Set();
  if (Array.isArray(input.order)) {
    for (const rawId of input.order) {
      const id = String(rawId);
      if (!validIds.has(id) || seen.has(id)) continue;
      seen.add(id);
      order.push(Number(id));
    }
  }

  const layoutMode = ['mixed','tier','custom'].includes(input.layoutMode)
    ? input.layoutMode
    : 'mixed';
  return { version:1, layoutMode, order, colors };
}

function sanitizeRaceEditorState(input) {

}

    .filter(entry => entry.wheelID === wheelID)

    .sort((a, b) => {
      const ta = RACE_EDITOR_TIER_SORT[a.tier] ?? 5;
      const tb = RACE_EDITOR_TIER_SORT[b.tier] ?? 5;
      if (ta !== tb) return ta - tb;
      return Number(a.baseWeight || 0) - Number(b.baseWeight || 0)
        || WHEEL_ENTRIES.indexOf(a) - WHEEL_ENTRIES.indexOf(b);
    });
}

function applyWheelEditorOrder(wheelID, tierGroupedEntries) {
  const editorState = getWheelEditorState(wheelID);
  if (editorState.layoutMode === 'tier') {
    if (editorState.order.length === 0) return [...tierGroupedEntries];
    const savedPosition = new Map(
      editorState.order.map((id, index) => [String(id), index])
    );
    return [...tierGroupedEntries].sort((a, b) => {
      const ta = RACE_EDITOR_TIER_SORT[a.tier] ?? 5;
      const tb = RACE_EDITOR_TIER_SORT[b.tier] ?? 5;
      if (ta !== tb) return ta - tb;
      const pa = savedPosition.get(String(a.id));
      const pb = savedPosition.get(String(b.id));
      if (pa !== undefined || pb !== undefined) {
        if (pa === undefined) return 1;
        if (pb === undefined) return -1;
        if (pa !== pb) return pa - pb;
      }
      return Number(a.effectiveWeight ?? a.baseWeight ?? 0)
        - Number(b.effectiveWeight ?? b.baseWeight ?? 0) || Number(a.id) - Number(b.id);
    });
  }

  const mixed = interleaveRaceEntriesByTier(tierGroupedEntries);
  if (editorState.layoutMode === 'mixed') return mixed;

  const byId = new Map(mixed.map(entry => [String(entry.id), entry]));
  const ordered = [];
  const used = new Set();
  for (const rawId of editorState.order) {
    const id = String(rawId);
    const entry = byId.get(id);
    if (!entry || used.has(id)) continue;
    ordered.push(entry);
    used.add(id);
  }
  // New races are appended in the safe Mixed MMO order and never delete an
  // existing custom layout.
  for (const entry of mixed) {
    const id = String(entry.id);
    if (used.has(id)) continue;
    ordered.push(entry);
    used.add(id);
  }
  return ordered;
}

function applyRaceEditorOrder(tierGroupedEntries) {

}

}

function setRaceEditorRowColor(row, color, useDefault = false) {
  if (!row) return false;
  const id = String(row.dataset.raceId || '');
  const editorState = getWheelEditorState(activeWheelEditorID);
  const normalized = useDefault ? null : normalizeRaceEditorHex(color);
  if (!useDefault && !normalized) return false;

  if (useDefault) delete editorState.colors[id];
  else editorState.colors[id] = normalized;

  const visibleColor = useDefault
    ? (normalizeRaceEditorHex(row.dataset.defaultColor) || '#6E7480')
    : normalized;
  row.style.setProperty('--race-row-color', visibleColor);
  const picker = row.querySelector('.race-color-picker');
  const hex = row.querySelector('.race-color-hex');
  const select = row.querySelector('.race-color-preset-select');
  if (picker) picker.value = visibleColor;
  if (hex) hex.value = visibleColor;
  if (select) select.value = '';
  markWheelEditorDirty();
  scheduleRaceEditorSave();
  return true;
}

function saveRaceEditorOrderFromDom() {
  const rows = document.querySelectorAll('#race-editor-list .race-editor-row');
  const editorState = getWheelEditorState(activeWheelEditorID);
  editorState.order = [...rows].map(row => Number(row.dataset.raceId));
  editorState.layoutMode = 'custom';
  markWheelEditorDirty();
  updateRaceEditorPresetButtons();
  saveRaceEditorState(true);
}

function moveRaceEditorRow(row, direction) {
  if (!row?.parentNode) return;
  if (direction === 'up') {
    const previous = row.previousElementSibling;
    if (previous) row.parentNode.insertBefore(row, previous);
  } else {
    const next = row.nextElementSibling;
    if (next) row.parentNode.insertBefore(next, row);
  }
  saveRaceEditorOrderFromDom();
  row.scrollIntoView?.({ block:'nearest' });
}

function beginRaceEditorDrag(event, row) {
  if (!row || event.button > 0) return;
  event.preventDefault();
  raceEditorDraggedRow = row;
  raceEditorDragPointer = event.pointerId;
  row.classList.add('dragging');
  event.currentTarget?.setPointerCapture?.(event.pointerId);
}

function moveRaceEditorDrag(event) {
  if (!raceEditorDraggedRow || event.pointerId !== raceEditorDragPointer) return;
  event.preventDefault();
  const list = document.getElementById('race-editor-list');
  if (!list) return;
  const listRect = list.getBoundingClientRect();
  if (event.clientY < listRect.top + 32) list.scrollTop -= 12;
  else if (event.clientY > listRect.bottom - 32) list.scrollTop += 12;

  const rows = [...list.querySelectorAll('.race-editor-row:not(.dragging)')];
  const before = rows.find(row => {
    const rect = row.getBoundingClientRect();
    return event.clientY < rect.top + rect.height / 2;
  });
  if (before) list.insertBefore(raceEditorDraggedRow, before);
  else list.appendChild(raceEditorDraggedRow);
}

function endRaceEditorDrag(event) {
  if (!raceEditorDraggedRow || event.pointerId !== raceEditorDragPointer) return;
  raceEditorDraggedRow.classList.remove('dragging');
  raceEditorDraggedRow = null;
  raceEditorDragPointer = null;
  saveRaceEditorOrderFromDom();
}

function selectRaceEditorLayoutMode(mode) {
  if (!['mixed','tier','custom'].includes(mode)) return;
  const editorState = getWheelEditorState(activeWheelEditorID);
  if (mode === 'tier') {
    const tierEntries = getWheelEditorTierGroupedEntries(activeWheelEditorID);
    const byId = new Map(tierEntries.map(entry => [String(entry.id), entry]));
    const preferredOrder = activeWheelEditorID === 'Race'
      ? DEFAULT_RACE_EDITOR_ORDER
      : tierEntries.map(entry => entry.id);
    editorState.order = [
      ...preferredOrder.filter(id => byId.has(String(id))),
      ...tierEntries.map(entry => entry.id).filter(id => !preferredOrder.includes(id))

  } else if (mode === 'custom' && editorState.order.length === 0) {
    const rows = document.querySelectorAll('#race-editor-list .race-editor-row');
    editorState.order = [...rows].map(row => Number(row.dataset.raceId));

  editorState.layoutMode = mode;
  markWheelEditorDirty();
  saveRaceEditorState(true);
  renderRaceEditorList();

function selectWheelEditorWheel(wheelID) {
  if (!WHEEL_EDITOR_IDS.has(wheelID) || wheelID === activeWheelEditorID) return;
  if (raceEditorSaveTimer) saveRaceEditorState(false);
  activeWheelEditorID = wheelID;

function refreshWheelFromEditor(wheelID) {
  const currentWheelID = generatorActive && genStep < WHEEL_ORDER.length
    ? WHEEL_ORDER[genStep]

  if (currentWheelID !== wheelID || spinning || pendingAdvance) return;
  endCompositedSpin();
  const parentResult = genResults['Race']?.displayName || null;
  const entries = getEntriesForWheel(wheelID, parentResult);
  if (!entries.length) return;
  segLayout = buildSegments(entries, wheelID);
  currentRotation = 0;
  winnerSeg = null;
  lastTickSeg = null;
  drawWheel._spinLayerLayout = null;
  drawWheel._spinLayerWheelID = null;

function refreshRaceWheelFromEditor() {

}

function openRaceEditor() {
  if (spinning || pendingAdvance) return false;
  const currentWheelID = generatorActive && genStep < WHEEL_ORDER.length
    ? WHEEL_ORDER[genStep]

  if (WHEEL_EDITOR_IDS.has(currentWheelID)) activeWheelEditorID = currentWheelID;

}

function closeRaceEditor() {
  if (raceEditorSaveTimer) saveRaceEditorState(false);
  document.getElementById('race-editor-overlay')?.classList.remove('open');
  if (raceEditorDirty) {
    for (const wheelID of wheelEditorDirtyWheels) refreshWheelFromEditor(wheelID);
  }
  raceEditorDirty = false;
  wheelEditorDirtyWheels.clear();
}

function exportRaceEditorJSON() {
  saveRaceEditorState(false);
  const editorState = getWheelEditorState(activeWheelEditorID);
  const payload = {
    kind: 'wheel-of-origin-segment-layout',
    version: 1,
    wheelID: activeWheelEditorID,
    exportedAt: new Date().toISOString(),

  if (activeWheelEditorID === 'Race') payload.raceEditor = editorState;
  else payload.professionEditor = editorState;
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement('a');

  anchor.style.display = 'none';

async function importRaceEditorJSON(file) {
  if (!file) return;
  try {
    const parsed = JSON.parse(await file.text());
    const targetWheelID = WHEEL_EDITOR_IDS.has(parsed?.wheelID)
      ? parsed.wheelID
      : (parsed?.raceEditor
          ? 'Race'
          : (parsed?.professionEditor ? 'Profession' : activeWheelEditorID));
    const candidate = parsed?.editorState
      || parsed?.wheelEditor
      || parsed?.raceEditor
      || parsed?.professionEditor
      || parsed;
    activeWheelEditorID = targetWheelID;
    setWheelEditorState(
      targetWheelID,

// The Race wheel is the first visual hook in every recording. Distribute its
// tier colours around the circle instead of painting six solid rarity blocks.
// Only array order changes here: entries keep the same effectiveWeight, object
// identity, stats and selection chance.
const RACE_MIX_TIER_ORDER = [
  'Common', 'Rare', 'Uncommon', 'Epic', 'Legendary', 'Mythic',
  'OP', 'Trash', 'None'
];

function interleaveRaceEntriesByTier(entries) {
  if (!Array.isArray(entries) || entries.length < 3) return [...entries];

  const buckets = new Map();
  for (const entry of entries) {
    const tier = entry.tier || 'Common';
    if (!buckets.has(tier)) buckets.set(tier, []);
    buckets.get(tier).push(entry);
  }

  const extraTiers = [...buckets.keys()].filter(t => !RACE_MIX_TIER_ORDER.includes(t));
  const tierOrder = [...RACE_MIX_TIER_ORDER, ...extraTiers];
  const orderRank = new Map(tierOrder.map((tier, index) => [tier, index]));
  const originalCounts = new Map();
  const credits = new Map();
  for (const tier of tierOrder) {
    const count = buckets.get(tier)?.length || 0;
    originalCounts.set(tier, count);
    credits.set(tier, 0);
  }

  // Begin on a Common field when available. Apart from giving the circle a
  // neutral seam, this avoids the first and final wedges sharing a tier in the
  // current Race data set.
  const openingTier = buckets.get('Common')?.length
    ? 'Common'
    : tierOrder.find(tier => buckets.get(tier)?.length);
  if (openingTier) credits.set(openingTier, entries.length);

  const mixed = [];
  let previousTier = null;
  while (mixed.length < entries.length) {
    const available = tierOrder.filter(tier => buckets.get(tier)?.length);
    if (!available.length) break;

    for (const tier of available) {
      credits.set(tier, credits.get(tier) + originalCounts.get(tier));
    }

    const nonRepeating = available.filter(tier => tier !== previousTier);
    const pool = nonRepeating.length ? nonRepeating : available;
    pool.sort((a, b) =>
      credits.get(b) - credits.get(a) ||
      originalCounts.get(b) - originalCounts.get(a) ||
      orderRank.get(a) - orderRank.get(b)
    );

    const chosenTier = pool[0];
    credits.set(chosenTier, credits.get(chosenTier) - entries.length);
    mixed.push(buckets.get(chosenTier).shift());
    previousTier = chosenTier;
  }

  // The wheel is cyclic, so also remove a possible same-tier join between its
  // last and first wedges. This is a deterministic one-time layout operation.
  const lastIndex = mixed.length - 1;
  if (lastIndex > 2 && mixed[0].tier === mixed[lastIndex].tier) {
    for (let i = 1; i < lastIndex - 1; i++) {
      const candidate = mixed[i];
      const tail = mixed[lastIndex];
      const candidateFitsTail =
        mixed[lastIndex - 1].tier !== candidate.tier && candidate.tier !== mixed[0].tier;
      const tailFitsGap =
        mixed[i - 1].tier !== tail.tier && tail.tier !== mixed[i + 1].tier;
      if (!candidateFitsTail || !tailFitsGap) continue;
      mixed[i] = tail;
      mixed[lastIndex] = candidate;
      break;
    }
  }

  return mixed;
}

function buildSegments(entries, wheelID) {
  wheelID = wheelID || entries[0]?.wheelID;
  const weighted = entries.map(entry => ({...entry,effectiveWeight:getEffectiveWeight(entry,wheelID)})).filter(e => e.effectiveWeight > 0);
  const sorted = WHEEL_EDITOR_IDS.has(wheelID) ? applyWheelEditorOrder(wheelID,weighted) : weighted;
  const total = sorted.reduce((s,e) => s + e.effectiveWeight,0);
  const editor = WHEEL_EDITOR_IDS.has(wheelID) ? getWheelEditorState(wheelID) : null;
  let angle = 0;
  return sorted.map((entry,index) => {
    const span = entry.effectiveWeight / total * Math.PI * 2;
    const color = editor?.colors[String(entry.id)] || RETRO_PALETTE[entry.id % 100 % RETRO_PALETTE.length];
    const segment = {entry,weight:entry.effectiveWeight,startAngle:angle,endAngle:angle+span,centerAngle:angle+span/2,
      color,textColor:getRaceEditorContrastText(color),customColor:true,label:getDisplayLabel(entry)};
    angle += span; return segment;
  });
}

function weightedPickSegment(layout) {
  const total = layout.reduce((s, s2) => s + s2.weight, 0);
  let r = Math.random() * total;
  for (const seg of layout) {
    r -= seg.weight;
    if (r <= 0) return seg;
  }
  return layout[layout.length - 1];
}

// Which segment is currently under the top pointer (-PI/2 in wheel-space)
function getSegmentAtPointer(layout, rotation) {
  // pointer is at angle -PI/2 in canvas space.
  // A segment painted at startAngle..endAngle (in wheel-local space)
  // appears at (startAngle + rotation) in canvas space.
  // We want: which seg contains (-PI/2 - rotation) mod 2PI in wheel-local space.
  const PI2 = 2 * Math.PI;
  const pointerInWheel = ((-Math.PI / 2 - rotation) % PI2 + PI2) % PI2;
  for (const seg of layout) {
    if (pointerInWheel >= seg.startAngle && pointerInWheel < seg.endAngle) return seg;
  }
  return layout[0];
}


// Farbe auf- (+) oder abdunkeln (-), Faktor -1..1
function s2Shade(hex, amt) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '');
  if (!m) return hex;
  const f = (v) => {
    let n = parseInt(v, 16);
    n = amt < 0 ? n * (1 + amt) : n + (255 - n) * amt;
    return Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2, '0');
  };
  return '#' + f(m[1]) + f(m[2]) + f(m[3]);
}

// Segment geometry is static until the wheel or canvas size changes. Safari
// can reuse a Path2D much more cheaply than rebuilding dozens of arcs per frame.
function getCachedSegmentPath(seg, radius) {
  if (typeof Path2D !== 'function') return null;
  const key = `${radius}|${seg.startAngle}|${seg.endAngle}`;
  if (seg._pathKey !== key) {
    const path = new Path2D();
    path.moveTo(0, 0);
    path.arc(0, 0, radius, seg.startAngle, seg.endAngle);
    path.closePath();
    seg._path = path;
    seg._pathKey = key;
  }
  return seg._path;
}

function drawFixedWheelChrome(renderCtx, W) {
  const r = W * .115, p = Math.max(2, Math.round(W/110));
  renderCtx.save();
  renderCtx.fillStyle = '#ffe39b';
  renderCtx.beginPath();
  renderCtx.moveTo(0,-r-W*.03);renderCtx.lineTo(p*2,-r+p);renderCtx.lineTo(-p*2,-r+p);renderCtx.closePath();renderCtx.fill();
  renderCtx.beginPath();
  const pts=[[-.55,-1],[.55,-1],[.55,-.8],[.8,-.8],[.8,-.55],[1,-.55],[1,.55],[.8,.55],[.8,.8],[.55,.8],[.55,1],[-.55,1],[-.55,.8],[-.8,.8],[-.8,.55],[-1,.55],[-1,-.55],[-.8,-.55],[-.8,-.8],[-.55,-.8]];
  pts.forEach(([x,y],i) => i ? renderCtx.lineTo(Math.round(x*r),Math.round(y*r)) : renderCtx.moveTo(Math.round(x*r),Math.round(y*r)));
  renderCtx.closePath();renderCtx.fillStyle='#171c36';renderCtx.fill();
  renderCtx.lineWidth=p;renderCtx.strokeStyle='#c4f5d2';renderCtx.stroke();
  renderCtx.font = Math.round(W*.027)+'px Pixel, monospace';
  renderCtx.textAlign='center';renderCtx.textBaseline='middle';renderCtx.fillStyle='#ffe39b';
  renderCtx.fillText('SPIN',0,1);
  renderCtx.restore();
}

function drawFixedWheelRings(renderCtx, outerRadius, segmentRadius) {
  renderCtx.beginPath();renderCtx.arc(0,0,outerRadius,0,Math.PI*2);renderCtx.fillStyle='#192139';renderCtx.fill();
  renderCtx.strokeStyle='#b9e9c8';renderCtx.lineWidth=2.5;renderCtx.stroke();
  renderCtx.beginPath();renderCtx.arc(0,0,segmentRadius+1,0,Math.PI*2);renderCtx.strokeStyle='#182039';renderCtx.lineWidth=2;renderCtx.stroke();
}

// On iPad Safari, repeatedly redrawing even a small wheel can occasionally lose
// a frame when audio or SVG text is updated at the same time. Capture every
// finished wheel face once and let Safari's compositor rotate that single
// layer. The normal high-resolution vector wheel is restored at landing.
function captureSpinLayer(rotation) {
  if (!spinCanvas || !spinCtx) return;
  if (window.innerWidth <= 600) return;
  if (!segLayout.length || spinning || winnerSeg) return;
  if (Math.abs(rotation) > 0.000001) return;

  if (spinCanvas.width !== canvas.width || spinCanvas.height !== canvas.height) {
    spinCanvas.width = canvas.width;
    spinCanvas.height = canvas.height;
  }
  spinCanvas.style.width = `${canvasSize}px`;
  spinCanvas.style.height = `${canvasSize}px`;
  spinCtx.setTransform(1, 0, 0, 1, 0, 0);
  spinCtx.clearRect(0, 0, spinCanvas.width, spinCanvas.height);
  // Called before the fixed hub and pointer are drawn, so only the rotating
  // wheel face is copied to this layer.
  spinCtx.drawImage(canvas, 0, 0);
  drawWheel._spinLayerLayout = segLayout;
  drawWheel._spinLayerWheelID = WHEEL_ORDER[genStep];
  drawWheel._spinLayerBaseRotation = rotation;
}

function drawSpinChromeOnly() {
  const W = canvasSize;
  const dpr = canvas._dpr || 1;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.translate(W / 2, W / 2);
  // The cached layer already contains the circular outer rings. They are
  // rotationally symmetric, so only hub and pointer need this fixed overlay.
  drawFixedWheelChrome(ctx, W);
  ctx.restore();
}

function beginCompositedSpin(startRotation, finalRotation, duration) {
  if (!spinCanvas || !spinCtx) return false;
  if (drawWheel._spinLayerLayout !== segLayout) return false;
  if (drawWheel._spinLayerWheelID !== WHEEL_ORDER[genStep]) return false;
  if (spinCanvas.width !== canvas.width || spinCanvas.height !== canvas.height) return false;

  compositeSpinActive = true;
  spinCanvas.style.display = 'block';
  spinCanvas.style.willChange = 'transform';
  const baseRotation = drawWheel._spinLayerBaseRotation || 0;
  spinCanvas.style.transform = `rotate(${startRotation - baseRotation}rad)`;

  // A transform-only Web Animation is evaluated by Safari's compositor. Even
  // if audio or the changing SVG headline briefly occupies the JavaScript main
  // thread, the visible wheel therefore keeps moving smoothly. Dense exact
  // cubic samples preserve the existing spin curve and final landing angle.
  compositeSpinAnimation = null;
  if (typeof spinCanvas.animate === 'function'
      && Number.isFinite(finalRotation) && Number.isFinite(duration) && duration > 0) {
    try {
      const keyframes = [];
      const keyframeSteps = 120;
      for (let i = 0; i <= keyframeSteps; i++) {
        const t = i / keyframeSteps;
        const ease = 1 - Math.pow(1 - t, 3);
        const angle = startRotation + (finalRotation - startRotation) * ease - baseRotation;
        keyframes.push({ offset: t, transform: `rotate(${angle}rad)` });
      }
      compositeSpinAnimation = spinCanvas.animate(keyframes, {
        duration,
        easing: 'linear',
        fill: 'forwards',
      });
    } catch (_) {
      compositeSpinAnimation = null;
    }
  }
  drawSpinChromeOnly();
  return true;
}

function updateCompositedSpin(rotation) {
  if (!compositeSpinActive || !spinCanvas) return false;
  // The native transform animation keeps running without per-frame style
  // writes. Older Safari versions use the proven requestAnimationFrame path.
  if (compositeSpinAnimation && compositeSpinAnimation.playState !== 'idle') return true;
  compositeSpinAnimation = null;
  spinCanvas.style.transform = `rotate(${rotation - (drawWheel._spinLayerBaseRotation || 0)}rad)`;
  return true;
}

function endCompositedSpin() {
  compositeSpinActive = false;
  if (!spinCanvas) return;
  spinCanvas.style.display = 'none';
  if (compositeSpinAnimation) {
    try { compositeSpinAnimation.cancel(); } catch (_) {}
    compositeSpinAnimation = null;
  }
  spinCanvas.style.willChange = 'auto';
  spinCanvas.style.transform = 'none';
}

function drawWheel(rotation, knownPointerSeg) {
  const W = canvasSize;
  const cx = W / 2, cy = W / 2;
  const OUTER_R = W / 2 - 2;
  const RING_W  = W * 0.022;
  const R       = OUTER_R - RING_W;
  const dpr = canvas._dpr || 1;

  // Determine the pointer segment once per frame. Previously the same linear
  // search was repeated for every label while the wheel was spinning.
  const pointerSeg = knownPointerSeg || getSegmentAtPointer(segLayout, rotation);

  ctx.clearRect(0, 0, W * dpr, W * dpr);
  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.translate(cx, cy);

  // Outer ring
  drawFixedWheelRings(ctx, OUTER_R, R);

  // Rotate the whole wheel layer once. All cached segment paths and label
  // angles can then stay in local wheel coordinates.
  ctx.save();
  ctx.rotate(rotation);

  // Draw the flat segment colours first. The alternating shade is cached on
  // each layout entry because it does not change during a spin.
  for (let idx = 0; idx < segLayout.length; idx++) {
    const seg = segLayout[idx];

    // Zwei Nuancen im Wechsel: jedes zweite Segment einen Hauch heller.
    // Sonst verschmelzen z. B. die 16 grauen Common-Felder zu einem Klumpen.
    const baseKey = `${seg.color}|${idx & 1}|${seg.customColor ? 1 : 0}`;
    if (seg._baseKey !== baseKey) {
      // A custom picker colour is respected exactly. Default palette segments
      // keep the subtle alternating lift that separates similar neighbours.
      seg._baseColor = seg.customColor
        ? seg.color
        : ((idx % 2) ? s2Shade(seg.color, 0.055) : seg.color);
      seg._baseKey = baseKey;
    }
    ctx.fillStyle = seg._baseColor;
    const cachedPath = getCachedSegmentPath(seg, R);
    if (cachedPath) {
      ctx.fill(cachedPath);
    } else {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, R, seg.startAngle, seg.endAngle);
      ctx.closePath();
      ctx.fill();
    }
  }

  // The old Season-2 renderer filled every single wedge with its own radial
  // gradient on every animation frame. On iPad Safari that is considerably
  // more expensive than the otherwise identical Season-1 renderer. The same
  // lighting is composited once over the complete disc instead: +6% white in
  // the centre, neutral at 55%, and -22% black at the rim.
  // The radial lighting is visually relevant while the wheel is stationary,
  // but during motion it causes a full-disc alpha blend on every frame. Skip
  // that invisible-in-motion pass and restore the exact shading at the stop.
  if (false) { // Flat retro palette; no glossy lighting.
    const shadeKey = `${R}|${canvas._dpr || 1}|${canvas.width}`;
    if (drawWheel._shadeKey !== shadeKey) {
      const shade = ctx.createRadialGradient(0, 0, R * 0.10, 0, 0, R);
      shade.addColorStop(0.00, 'rgba(255,255,255,0.06)');
      shade.addColorStop(0.55, 'rgba(255,255,255,0)');
      shade.addColorStop(1.00, 'rgba(0,0,0,0.22)');
      drawWheel._shadeGradient = shade;
      drawWheel._shadeKey = shadeKey;
    }
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, 2 * Math.PI);
    ctx.fillStyle = drawWheel._shadeGradient;
    ctx.fill();
  }

  // Winner dimming is only rendered for the final stationary frame, so it
  // cannot affect animation performance.
  if (!spinning && winnerSeg) {
    for (const seg of segLayout) {
      if (seg === winnerSeg) continue;
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      const cachedPath = getCachedSegmentPath(seg, R);
      if (cachedPath) {
        ctx.fill(cachedPath);
      } else {
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, R, seg.startAngle, seg.endAngle);
        ctx.closePath();
        ctx.fill();
      }
    }
  }

  // The previous wedge-by-wedge stroke traced every shared radial border
  // twice. Draw the same borders as one path and the outer rim as one circle.
  // 0.5376 is the source-over equivalent of two 0.32-alpha strokes.
  const borderKey = `${R}|${segLayout.length}`;
  if (typeof Path2D === 'function' && segLayout._borderKey !== borderKey) {
    const path = new Path2D();
    for (const seg of segLayout) {
      path.moveTo(0, 0);
      path.lineTo(Math.cos(seg.startAngle) * R, Math.sin(seg.startAngle) * R);
    }
    segLayout._borderPath = path;
    segLayout._borderKey = borderKey;
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.5376)';
  ctx.lineWidth = 0.7;
  if (segLayout._borderPath) {
    ctx.stroke(segLayout._borderPath);
  } else {
    ctx.beginPath();
    for (const seg of segLayout) {
      const edgeKey = `${R}|${seg.startAngle}`;
      if (seg._edgeKey !== edgeKey) {
        seg._edgeX = Math.cos(seg.startAngle) * R;
        seg._edgeY = Math.sin(seg.startAngle) * R;
        seg._edgeKey = edgeKey;
      }
      ctx.moveTo(0, 0);
      ctx.lineTo(seg._edgeX, seg._edgeY);
    }
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.arc(0, 0, R, 0, 2 * Math.PI);
  ctx.strokeStyle = 'rgba(0,0,0,0.32)';
  ctx.lineWidth = 0.7;
  ctx.stroke();

  // Never skip labels — even tiny Legendary/OP slices get a short readable label.

  function fitTextToRadialSpace(text, maxWidth, startSize, minSize = 7) {
    let fs = startSize;
    ctx.font = `${wheelLabelWeight} ${fs}px ${wheelLabelFont}`;
    while (ctx.measureText(text).width > maxWidth && fs > minSize) {
      fs -= 0.4;
      ctx.font = `${wheelLabelWeight} ${fs}px ${wheelLabelFont}`;
    }
    if (ctx.measureText(text).width <= maxWidth) return { text, fontSize: fs };
    let trimmed = text;
    while (trimmed.length > 2 && ctx.measureText(trimmed + '…').width > maxWidth) {
      trimmed = trimmed.slice(0, -1);
    }
    return { text: trimmed.length > 2 ? trimmed + '…' : text.slice(0, 2), fontSize: Math.max(minSize, fs) };

    const midA  = seg.centerAngle;
    const spanA = seg.endAngle - seg.startAngle;
    const entry = seg.entry || {};

    const isActive = (seg === pointerSeg);

    // ── Always render labels, even while spinning ──
    // (skip only truly invisible tiny segments)
    const skipThreshold   = isDenseLabelWheel ? 0.010 : 0.025;
    const shortThreshold  = isDenseLabelWheel ? 0.032 : 0.045;
    const mediumThreshold = isDenseLabelWheel ? 0.060 : 0.075;

    if (spanA < skipThreshold && !isActive) {
      continue;
    }

    ctx.save();
    // Keep every label physically attached to its segment. The extra half-turn
    // makes the first character start at the rim and the text run toward the hub;
    // there is deliberately no screen-relative flipping while the wheel spins.
    ctx.rotate(midA + Math.PI);

    // Label shortening, font selection and measureText only depend on the
    // current wheel geometry. Cache them on the segment instead of repeating
    // the work 60 times per second while it spins.
    const labelKey = `${W}|${currentWheelID}|${spanA}|${seg.label}|${entry.tier}|${seg.textColor}|${seg.customColor ? 1 : 0}`;
    if (!seg._labelRender || seg._labelRender.key !== labelKey) {
      const midR   = textEndR + radialSpace * 0.55;
      const arcPx  = spanA * midR;
      const isSmall = arcPx < 19;

      let label = getShortWheelLabel(seg.label || '', entry.wheelID || '');

      if (spanA < shortThreshold) {
        label = label.replace(/[^A-Za-z0-9]/g, '');
        label = label.slice(0, isDenseLabelWheel ? 3 : 4);
      } else if (spanA < mediumThreshold) {
        label = label.slice(0, isDenseLabelWheel ? 5 : 6);
      }

      let fontSize;
      if (spanA < shortThreshold) {
        fontSize = isDenseLabelWheel ? 6.2 : 6.7;
      } else if (spanA < mediumThreshold) {
        fontSize = Math.max(
          isDenseLabelWheel ? 7.2 : 7.7,
          Math.min(isDenseLabelWheel ? 9.0 : 9.6, arcPx * 0.78)
        );
      } else if (currentWheelID === 'Fate') {
        // Das Fate Wheel hat nur drei grosse Segmente. Seine kurzen
        // Hauptbegriffe duerfen deshalb deutlich praesententer sein.
        fontSize = Math.max(18.0, Math.min(20.0, W * 0.05, arcPx * 0.82));
      } else {
        fontSize = Math.max(9.0, Math.min(15.0, W * 0.038, arcPx * 0.82));
      }

      const isTiny = fontSize <= 6.7;
      const useWhiteText = ['Legendary','OP','Epic','Rare','Trash'].includes(entry.tier) || isTiny || isSmall;
      const fitted = fitTextToRadialSpace(label, radialSpace - 3, fontSize, isTiny ? 6.0 : 7.0);
      seg._labelRender = {
        key: labelKey,
        text: fitted.text,
        font: `${wheelLabelWeight} ${fitted.fontSize}px ${wheelLabelFont}`,
        fill: seg.customColor
          ? (seg.textColor || '#ffffff')
          : (useWhiteText ? '#ffffff' : (seg.textColor || '#ffffff')),
        lineWidth: isTiny ? 0.75 : 1.0,
        x: -textStartR
      };
    }
    const labelRender = seg._labelRender;

    ctx.textBaseline = 'middle';
    ctx.textAlign    = 'left';
    ctx.lineJoin     = 'round';
    ctx.miterLimit   = 2;

    ctx.font = labelRender.font;

    // A thin outline stays sharp on Retina displays. The previous 3-4 px blur
    // made small letters look soft through headphones/iPad screen recording
    // and also cost more to render during a spin.
    ctx.shadowColor   = 'transparent';
    ctx.shadowBlur    = 0;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;
    ctx.strokeStyle = 'rgba(0,0,0,0.72)';
    ctx.lineWidth = labelRender.lineWidth;
    // The outline is valuable once the wheel stops. While moving it is not
    // perceptible, but doubles all text draw calls on dense wheels.
    if (!isSpinningRenderMode) {
      ctx.strokeText(labelRender.text, labelRender.x, 0);
    }
    ctx.fillStyle = labelRender.fill;
    ctx.fillText(labelRender.text, labelRender.x, 0);

    ctx.restore();
  }

  // End of the rotating wheel layer. Pointer and hub stay screen-fixed.
  ctx.restore();

  captureSpinLayer(rotation);

  drawFixedWheelChrome(ctx, W);

  ctx.restore();
}

  if (!area.clientWidth || !area.clientHeight) return;
  canvasSize = Math.max(80,Math.floor(Math.min(area.clientWidth-16,area.clientHeight-12)));
  const dpr = Math.min(window.devicePixelRatio || 1,2);
  canvas.width = Math.round(canvasSize*dpr); canvas.height = Math.round(canvasSize*dpr);
  canvas.style.width = canvasSize+'px';canvas.style.height = canvasSize+'px';canvas._dpr=dpr;
  if(spinCanvas){spinCanvas.style.width=canvasSize+'px';spinCanvas.style.height=canvasSize+'px';}
  drawWheel._shadeKey=null;drawWheel._spinLayerLayout=null;drawWheel._spinLayerWheelID=null;
  drawWheel(currentRotation);
}

const STAT_KEYS = ['STR', 'IQ', 'SPD', 'DUR', 'PM', 'DEF'];

  };
